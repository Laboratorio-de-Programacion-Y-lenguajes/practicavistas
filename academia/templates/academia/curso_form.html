{% extends 'base.html' %}

{% block content %}
  <h1>Crear/Editar Curso</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label>{{ field.label }}</label>
            {{ field }} {% if field.errors %}
                <div class="text-danger">
                    {{ field.errors }} </div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar Curso</button>
  </form>

{% endblock %}
